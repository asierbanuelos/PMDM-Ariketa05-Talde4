<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Idazleak
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let user of users">
      <ion-avatar slot="start">
        <img [src]="user.avatar" />
      </ion-avatar>
      <ion-label>
        <h2>{{ user.first_name }} {{ user.last_name }}</h2>
        <p>{{ user.email }}</p>
      </ion-label>
      <ion-button color="danger" (click)="deleteUser(user.id)">Borrar</ion-button>
      <ion-button color="primary" (click)="editUser(user)">Editar</ion-button>
    </ion-item>
  </ion-list>

  <ion-card>
    <ion-card-header>
      <ion-card-title>{{ isEditing ? 'Editar Idazlea' : 'Añadir Idazlea' }}</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-item>
        <ion-label position="floating">Nombre</ion-label>
        <ion-input [(ngModel)]="newUser.first_name"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Apellido</ion-label>
        <ion-input [(ngModel)]="newUser.last_name"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Email</ion-label>
        <ion-input [(ngModel)]="newUser.email"></ion-input>
      </ion-item>
      <ion-button expand="full" *ngIf="!isEditing" (click)="addUser()">Añadir</ion-button>
      <ion-button expand="full" color="success" *ngIf="isEditing" (click)="updateUser()">Actualizar</ion-button>
      <ion-button expand="full" color="medium" *ngIf="isEditing" (click)="cancelEdit()">Cancelar</ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
